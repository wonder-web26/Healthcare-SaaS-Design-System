  if((p.cat==="n"&&p.mandat!=="privat")||(p.cat!=="n"&&p.mandat==="privat")||(p.cat==="c"&&p.mandat==="ivg"))b.mandat.push(p);
  if((p.cat==="b"&&p.ausf==="ang")||KSTUFE[p.ausf]<STUFE[p.mq])b.qual.push(p);});
 b.ohneMass=S.massOhne.map(m=>({id:m,lb:MASS[m]}));return b;}
const blk=()=>{const b=bef();return b.richtzeit.length+b.qual.length+b.leer.length+b.drift.length+b.mandat.length
 +b.manuell.filter(p=>!p.mGrund).length+b.wOhne.filter(p=>p.w==="V"&&!p.wGrund).length;};
const hatB=()=>S.pos.some(p=>p.cat==="b"&&p.w==="S");
const lock=()=>S.status==="gemeldet"||S.status==="aktiv";
const ro=()=>S.rolle!=="hf"||lock();
const bB=()=>hatB()&&S.order!=="erhalten";

function rKopf(){
 const st={entwurf:{d:"idle",t:"Entwurf"},freigegeben:{d:"live",t:"Freigegeben"},

 let prim;
 if(S.rolle!=="hf")prim=`<span class="tag grey">nur Lesezugriff</span>`;
 else if(S.status==="entwurf")prim=`<button class="btn btn--p" onclick="oFinal()">Prüfen und freigeben</button>`;
 else if(S.status==="freigegeben")prim=`<button class="btn btn--p" onclick="oMeld()">Bedarfsmeldung erstellen</button>`;
 else if(S.status==="gemeldet"&&bB())prim=`<button class="btn btn--p" onclick="oAnord()">Anordnung erfassen</button>`;
 else prim=`<button class="btn btn--o" onclick="oErn()">Periode erneuern</button>`;
 const d=ro()?"disabled":"";
 document.getElementById("kopf").innerHTML=`
  <span class="st"><span class="dot ${st.d}"></span>LPB v${S.version} · ${st.t}</span>
  <input type="date" value="${S.start}" ${d} onchange="setStart(this.value)">
  <span style="color:var(--t3)">bis</span>
  <input type="date" value="${isoE()}" ${d} onchange="setEnde(this.value)">
  <span class="seg">${[1,3,6,9].map(m=>`<button ${d} aria-pressed="${S.monate===m}" onclick="setM(${m})">${m}</button>`).join("")}</span>
  ${S.monate>9?`<span class="tag err">über 9 Monate</span>`:""}
  <button class="btn btn--o btn--sm" onclick="oKopf()">Kopfdaten</button>
  ${ro()?"":`<button class="btn btn--o btn--sm" onclick="oKat()">+ Position</button>`}
  <span class="sp"></span>
  ${!ro()?`<span class="save">${S.savedAt}${undoS.length?` · <button onclick="undo()">Rückgängig</button>`:""}</span>`:""}
  ${prim}`;}

function rBand(){const b=bef();
 const c=[{i:"drift",l:"Pflegeplan geändert",n:b.drift.length,k:"warn"},
  {i:"richtzeit",l:"Begründung fehlt",n:b.richtzeit.length,k:"err"},

 document.getElementById("band").innerHTML=

   :`<span class="tag ok">keine Abweichung</span>`)+

function rBan(){let h="";
 if(bB())h+=`<div class="banner err"><span class="dot err"></span><div class="bt">B-Positionen blockiert, A und C laufen weiter.</div>
  ${S.order==="fehlt"?`<button class="btn btn--o btn--sm" onclick="S.order='angefragt';render()">Anordnung anfordern</button>`

 document.getElementById("banners").innerHTML=h;}

const passt=p=>{if(!S.filter)return true;if(S.filter==="ohneMass")return false;return (bef()[S.filter]||[]).some(x=>x.id===p.id);};

function rTab(){const s=sum();let h="";
 if(S.filter==="ohneMass"){
  h=`<div class="gh"><div class="l">Massnahmen ohne Position</div></div>`+
   bef().ohneMass.map(m=>`<div style="padding:10px 14px;border-bottom:1px solid var(--n300);font-size:12px">

 ["a","b","c","n"].forEach(cat=>{

  h+=`<table><colgroup><col class="c-x"><col class="c-nr"><col><col class="c-h"><col class="c-z"><col class="c-d"><col class="c-a"><col class="c-m"><col class="c-s"></colgroup>
   <thead><tr><th></th><th>Nr.</th><th>Leistung</th><th class="n">Häufigkeit</th><th class="n">Zeit</th>

 if(p.w!=="S")st.push(`<span class="tag grey">${WL[p.w]}</span>`);
 if(p.anzPlan!==null&&(p.anz!==p.anzPlan||p.einh!==p.einhPlan))st.push(`<span class="tag info">≠ Plan</span>`);
 if(diff>0&&p.begr)st.push(`<span class="tag ok">begründet</span>`);
 if(p.t)st.push(`<span class="tag grey">T</span>`);
 const sn=simN(p);
 let h=`<tr class="${p.w!=="S"?"dim":""} ${S.filter&&passt(p)?"hit":""}">
  <td><button class="exp" onclick="tog('${p.id}')" aria-expanded="${op}">${op?"▾":"▸"}</button></td>

  <td class="n"><div class="freq"><input class="inp mono" style="width:22px" ${d} value="${p.anz}" onfocus="this.select()" onchange="set('${p.id}','anz',this.value)">
   <span style="color:var(--t3)">×</span>
   <select class="sel" ${d} onchange="set('${p.id}','einh',this.value)">${["t7","t6","t5","t4","t3","t2","w","m","e"].map(v=>`<option ${p.einh===v?"selected":""}>${v}</option>`).join("")}</select></div></td>
  <td class="n"><input class="zi mono" ${d} value="${p.zeit}" inputmode="numeric" onfocus="this.select()" onchange="set('${p.id}','zeit',this.value)"></td>
  <td class="n mono"><span class="delta ${diff>0?"p":(diff<0?"m":"z")}">${diff===0?"—":(diff>0?"+":"−")+Math.abs(diff)}</span></td>
  <td><select class="sel" ${d} onchange="set('${p.id}','ausf',this.value)">${Object.entries(AUSFK).map(([k,v])=>`<option value="${k}" ${p.ausf===k?"selected":""}>${v}</option>`).join("")}</select></td>
  <td class="n mono">${p.w!=="S"?"—":(p.einh==="e"?r0(m.ein)+"e":r0(m.mon))}</td>
  <td><div class="st-cell">${st.join("")}</div></td></tr>`;
 if(op)h+=`<tr class="det"><td colspan="9"><div class="dgrid">
   <div class="dg"><span class="k">Herkunft</span><span class="v">${p.herkunft==="pflegeplan"?p.mass.map(x=>MASS[x]).join(" · "):HERK[p.herkunft]}</span></div>
   <div class="dg"><span class="k">Erbringt</span><select ${d} onchange="setW('${p.id}',this.value)">${Object.entries(WL).map(([k,v])=>`<option value="${k}" ${p.w===k?"selected":""}>${v}</option>`).join("")}</select></div>
   <div class="dg"><span class="k">Mandat</span><select ${d} onchange="set('${p.id}','mandat',this.value)">${Object.entries(MAND).map(([k,v])=>`<option value="${k}" ${p.mandat===k?"selected":""}>${v}</option>`).join("")}</select></div>
   <div class="dg"><span class="k">Einsatz</span><select ${d} onchange="set('${p.id}','block',this.value)">${Object.entries(BLOCK).map(([k,v])=>`<option value="${k}" ${p.block===k?"selected":""}>${v}</option>`).join("")}</select></div>
   <div class="dg"><span class="k">Training</span><span class="v"><button class="btn btn--o btn--sm" ${d} onclick="tT('${p.id}')">${p.t?"gesetzt":"nicht gesetzt"}</button>
     ${p.t&&p.zeit===p.richt&&!d?` <button class="btn btn--l" onclick="aT('${p.id}')">+20 % = ${Math.round(p.richt*1.2)}</button>`:""}</span></div>
   <div class="dg"><span class="k">Richtzeit</span><span class="v mono">${p.richt} Min. · M-Qual ${p.mq}</span></div>
   <div class="dg"><span class="k">Ausführung</span><span class="v">${AUSF[p.ausf]}</span></div>
   ${p.herkunft==="manuell"?`<div class="dg"><span class="k">Position entfernen</span><span class="v"><button class="btn btn--o btn--sm" ${d} onclick="del('${p.id}')">Entfernen</button></span></div>`:""}
   </div>
   ${p.begr?`<div class="bg">Begründung: ${p.begr}</div>`:""}
   ${p.wGrund?`<div class="bg">Grund: ${p.wGrund}</div>`:""}
   ${p.mGrund?`<div class="bg">Einfügung: ${p.mGrund}</div>`:""}</td></tr>`;
 return h;}

function rFuss(){const s=sum(),g=simG();
 const tot=s.a.per+s.b.per+s.c.per,qu=(s.a.qu+s.b.qu+s.c.qu)/60;
 document.getElementById("fuss").innerHTML=
  ["a","b","c","n"].map(c=>`<div class="i"><span class="k">${c==="n"?"N":c.toUpperCase()}</span><span class="mono">${r1(s[c].tag)}</span><span class="k">Min./Tag</span></div>`).join("")+
  `<div class="i tot"><span class="k">Periode</span><span class="mono">${r0(tot)} Min. · ${hm(tot)} Std.</span></div>
   <div class="i"><span class="k">Quartal</span><span class="mono">${hm(s.a.qu+s.b.qu+s.c.qu)}</span>${qu>60?`<span class="tag warn">über 60 Std.</span>`:""}</div>

function snap(){undoS.push(JSON.stringify(S.pos));if(undoS.length>20)undoS.shift();}
function undo(){if(!undoS.length)return;S.pos=JSON.parse(undoS.pop());render();}
function tch(){S.savedAt=new Date().toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"});}
function set(id,f,v){snap();const p=S.pos.find(x=>x.id===id);
 if(f==="anz"||f==="zeit")v=Math.max(0,parseInt(v,10)||0);p[f]=v;tch();render();}
function tog(id){S.open=S.open===id?null:id;render();}
function tT(id){snap();const p=S.pos.find(x=>x.id===id);p.t=!p.t;p.tH=p.t?"lokal":null;tch();render();}

function setEnde(v){snap();const a=new Date(S.start),b=new Date(v);
 S.monate=Math.max(1,(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())+(b.getDate()>=a.getDate()?1:0));tch();render();}
function del(id){snap();S.pos=S.pos.filter(p=>p.id!==id);S.open=null;tch();render();}

 const sec=(t,it,ok)=>`<div class="sec"><div class="sh"><span>${t}</span><span class="tag ${it.length?"warn":"ok"}">${it.length}</span></div>
  <div class="sb">${it.length?it.map(i=>`<div class="li"><div>${i.a}<div class="d">${i.b}</div></div><div>${i.c||""}</div></div>`).join("")

 md(`<div class="modal"><header>Prüfen und freigeben</header><div class="mb">
  ${off?`<div class="sec" style="border-color:var(--red)"><div class="sh" style="background:#a2354414;color:var(--red7)">
    <span>${off} offene Punkte</span></div></div>`:""}
  ${sec("Kopfdaten",[{a:fmt(new Date(S.start))+" bis "+fmt(addM(S.start,S.monate)),b:S.monate+" Monate",c:`<span class="tag ${S.monate>9?"err":"ok"}">Zeitraum</span>`},
    {a:ABKL[S.abklTyp],b:fmt(new Date(S.abklDatum)),c:""},
    {a:S.andereZSR||"keine weiteren Leistungserbringer",b:"",c:""}],"")}
  ${sec("Zeit über Richtzeit",S.pos.filter(p=>p.zeit>p.richt).map(p=>({a:p.nr+" "+p.lb,b:p.begr||"Begründung fehlt",
    c:`<span class="tag ${p.begr?"ok":"err"}">+${p.zeit-p.richt}</span>`})),"keine")}
  ${sec("Vom Pflegeplan abweichend",S.pos.filter(p=>p.anzPlan!==null&&(p.anz!==p.anzPlan||p.einh!==p.einhPlan))
    .map(p=>({a:p.nr+" "+p.lb,b:`Plan ${p.anzPlan}×${p.einhPlan}, Blatt ${p.anz}×${p.einh}`,c:""})),"keine")}
  ${sec("Mandat",b.mandat.map(p=>({a:p.nr+" "+p.lb,b:MAND[p.mandat]+" bei "+(p.cat==="n"?"Nicht-KLV":"KLV "+p.cat),c:`<span class="tag err">unzulässig</span>`})),"zulässig")}
  ${sec("Nicht durch uns erbracht",S.pos.filter(p=>p.w!=="S").map(p=>({a:p.nr+" "+p.lb,b:p.wGrund||"",c:`<span class="tag grey">${WL[p.w]}</span>`})),"keine")}
  ${sec("Hier eingefügt",b.manuell.map(p=>({a:p.nr+" "+p.lb,b:p.mGrund||"Grund fehlt",c:""})),"keine")}
  ${sec("Massnahmen ohne Position",b.ohneMass.map(m=>({a:m.lb,b:"",c:`<span class="tag warn">offen</span>`})),"alle abgedeckt")}
  </div><footer><button class="btn btn--s" onclick="cm()">Zurück</button>
  <button class="btn btn--p" ${off?"disabled":""} onclick="frei()">Freigeben</button></footer></div>`);}
function frei(){S.status="freigegeben";cm();render();}

 md(`<div class="modal"><header>Bedarfsmeldung an Groupe Mutuel</header><div class="mb">

   <th class="n" style="padding:4px 8px">Total Periode</th></tr></thead><tbody>
   ${["a","b","c"].map(c=>`<tr><td style="padding:3px 8px">KLV ${c}</td><td class="n mono">${r1(s[c].monR)}</td>
     <td class="n mono">${r0(s[c].ein)}</td><td class="n mono">${r1(s[c].per)}</td></tr>`).join("")}</tbody></table>
  <div class="sec" style="margin-top:10px"><div class="sh"><span>Nicht mitgeliefert</span></div><div class="sb">

 <footer><button class="btn btn--s" onclick="cm()">Später</button></footer></div>`);}
function sOk(){S.meldung=true;S.status="gemeldet";cm();render();}
function sFail(){md(`<div class="modal nw"><header>Fehlgeschlagen</header><div class="mb">
 <div style="font-size:12px">GLN der Pflegefachperson fehlt. Version bleibt offen, Inhalt erhalten.</div></div>
 <footer><button class="btn btn--s" onclick="cm()">Später</button><button class="btn btn--p" onclick="send()">Erneut senden</button></footer></div>`);}

document.addEventListener("keydown",e=>{
 if(e.key==="Escape")cm();
 if(e.key==="/"&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();if(!ro())oKat();}
 if((e.ctrlKey||e.metaKey)&&e.key==="z"){e.preventDefault();if(!ro())undo();}});

function rDemo(){const b=bef();
 const st=[{t:"Zeile aufklappen für Herkunft, W, Mandat, Einsatz, T",d:!!S.open},
  {t:"Plan geändert lösen",d:!b.drift.length},{t:"Begründung bei 10104",d:!b.richtzeit.length},
  {t:"Grund bei 10105",d:!b.manuell.filter(p=>!p.mGrund).length},
  {t:"Prüfen und freigeben",d:S.status!=="entwurf"},{t:"Senden",d:!!S.meldung}];
 const i=st.findIndex(x=>!x.d);
 document.getElementById("ds").innerHTML=st.map((x,j)=>`<li style="${x.d?'opacity:.4;text-decoration:line-through':(j===i?'font-weight:600':'')}">${x.t}</li>`).join("");}
function reset(){S=initial();undoS=[];cm();render();}
reset();
