function formatDate(iso) { if (!iso) return "—"; const [y,m,d] = iso.split("-"); return `${d}.${m}.${y}`; }

  return (
    <div style={{
      width: size, height: size, borderRadius: 999, background: bg, color: fg,
      display: "inline-flex", alignItems: "center", justifyContent: "center", flexShrink: 0,

}

    </span>

}
function PriorityDot({ prio }) {
  return <span title={prioCfg[prio].label} style={{ width: 6, height: 6, borderRadius: 999, background: prioCfg[prio].color, flexShrink: 0 }}/>;
}
function FaelligDate({ iso }) {
  if (!iso) return <span style={{ color: "#9CA3AF", fontSize: 12 }}>—</span>;
  const b = faelligBucket(iso);
  const colors = { ueberfaellig: "#991B1B", heute: "#92400E", morgen: "#92400E", diese_woche: "#374151", spaeter: "#6B7280" };
  const dotColors = { ueberfaellig: "#DC2626", heute: "#D97706", morgen: "#D97706", diese_woche: "#9CA3AF", spaeter: "#D1D5DB" };
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12, color: colors[b], whiteSpace: "nowrap", fontWeight: b === "ueberfaellig" || b === "heute" ? 500 : 400 }}>
      <span style={{ width: 5, height: 5, borderRadius: 999, background: dotColors[b] }}/>
      {formatDate(iso)}
    </span>
  );
}

// Entry title convention: for workflow-tasks and tickets with a person → person name; otherwise ticket title.
function entryTitle(e) {
  if (e.person) return e.person.name;
  return e.titel || "—";
}

window.helpers = { formatDate, formatShort, daysFromToday, faelligBucket, statusCfg, prioCfg, typColor, entryTitle };
window.shared = { Avatar, StatusPill, TypeTag, PriorityDot, FaelligDate };
})();
</script>

<script type="text/babel" data-presets="react">
/* ==========================================================
   URL State (query params)
   ========================================================== */
(function(){
function useUrlState() {
  const [state, setState] = React.useState(() => {
    const p = new URLSearchParams(window.location.search);
    return {
      view: p.get("view") || "mir",   // mir | team | alle | erledigt
      quelle: p.get("quelle") || "",  // workflow | ticket | ""
      typ: p.get("typ") || "",        // e.g. SRK_ANMELDUNG
      selected: p.get("id") || null,
    };
  });
  React.useEffect(() => {
    const p = new URLSearchParams();
    if (state.view !== "mir") p.set("view", state.view);
    if (state.quelle) p.set("quelle", state.quelle);
    if (state.typ) p.set("typ", state.typ);
    if (state.selected) p.set("id", state.selected);
    const qs = p.toString();
    const next = window.location.pathname + (qs ? "?" + qs : "");
    window.history.replaceState(null, "", next);
  }, [state]);
  return [state, setState];
}
window.useUrlState = useUrlState;
})();
</script>

<script type="text/babel" data-presets="react">
/* ==========================================================
   List + Detail
   ========================================================== */
(function(){
const { Avatar, StatusPill, TypeTag, PriorityDot, FaelligDate } = window.shared;
const { statusCfg, prioCfg, typColor, formatDate, faelligBucket, entryTitle } = window.helpers;
const { ENTRIES, WORKFLOW_TYPES, TICKET_TYPES } = window.APP_DATA;
const Icon = window.Icon;

const BUCKETS = [
  { key: "ueberfaellig",   label: "Überfällig",   color: "#DC2626" },
  { key: "heute",          label: "Heute",        color: "#D97706" },
  { key: "morgen",         label: "Morgen",       color: "#D97706" },
  { key: "diese_woche",    label: "Diese Woche",  color: "#111827" },
  { key: "spaeter",        label: "Später",       color: "#6B7280" },
  { key: "kein",           label: "Ohne Termin",  color: "#9CA3AF" },
];

function typLabelFor(id) {
  const m = [...WORKFLOW_TYPES, ...TICKET_TYPES].find(t => t.id === id);
  return m ? m.label : id;
}

function ServiceDeskPage({ urlState, setUrlState }) {
  const [filterOpen, setFilterOpen] = React.useState(false);

  const filtered = React.useMemo(() => {
    let list = ENTRIES;
    if (urlState.view === "mir") list = list.filter(e => e.verantwortlich.initialen === "MK");
    else if (urlState.view === "team") list = list.filter(e => ["MK","KM","SW"].includes(e.verantwortlich.initialen));
    else if (urlState.view === "erledigt") list = list.filter(e => e.status === "erledigt");
    // default for non-erledigt views: hide erledigt
    if (urlState.view !== "erledigt") list = list.filter(e => e.status !== "erledigt");
    if (urlState.quelle) list = list.filter(e => e.quelle === urlState.quelle);
    if (urlState.typ) list = list.filter(e => e.typ === urlState.typ);
    return list;
  }, [urlState.view, urlState.quelle, urlState.typ]);

  // Auto-select first entry when filter changes
  React.useEffect(() => {
    if (filtered.length === 0) {
      if (urlState.selected !== null) setUrlState(s => ({ ...s, selected: null }));
      return;
    }
    const exists = filtered.some(e => e.id === urlState.selected);
    if (!exists) setUrlState(s => ({ ...s, selected: filtered[0].id }));
  }, [filtered, urlState.selected]);

  const selected = ENTRIES.find(e => e.id === urlState.selected) || null;

  const grouped = React.useMemo(() => {
    const g = {};
    BUCKETS.forEach(b => g[b.key] = []);
    filtered.forEach(e => {
      const b = faelligBucket(e.faellig);
      (g[b] || g.kein).push(e);
    });
    Object.values(g).forEach(arr => arr.sort((a,b) => (a.faellig||"").localeCompare(b.faellig||"")));
    return g;
  }, [filtered]);

  const counts = {
    offen: filtered.filter(e => e.status !== "erledigt").length,
    ueberfaellig: grouped.ueberfaellig.length,
    dieseWoche: grouped.heute.length + grouped.morgen.length + grouped.diese_woche.length,
  };

  const views = [
    { id: "mir", label: "Mir zugewiesen", icon: "user", count: ENTRIES.filter(e => e.verantwortlich.initialen === "MK" && e.status !== "erledigt").length },
    { id: "team", label: "Mein Team", icon: "users", count: ENTRIES.filter(e => ["MK","KM","SW"].includes(e.verantwortlich.initialen) && e.status !== "erledigt").length },
    { id: "alle", label: "Alle", icon: "inbox", count: ENTRIES.filter(e => e.status !== "erledigt").length },
    { id: "erledigt", label: "Erledigt", icon: "checkcircle", count: ENTRIES.filter(e => e.status === "erledigt").length },
  ];

  return (
    <div style={{ display: "flex", height: "calc(100vh - 64px)", background: "white" }}>
      {/* LEFT — view rail */}
      <div style={{ width: 220, borderRight: "1px solid #F0F1F4", padding: "20px 14px", flexShrink: 0, overflowY: "auto", background: "#FAFBFC" }}>
        <div style={{ fontSize: 10.5, color: "#9CA3AF", textTransform: "uppercase", letterSpacing: 0.08, fontWeight: 500, padding: "0 8px 8px" }}>Ansichten</div>
        {views.map(v => {
          const isActive = urlState.view === v.id;
          return (
            <button key={v.id} onClick={() => setUrlState(s => ({ ...s, view: v.id }))} style={{
              width: "100%", display: "flex", alignItems: "center", gap: 10, padding: "7px 10px",
              borderRadius: 8, textAlign: "left", marginBottom: 2,
              background: isActive ? "#EEF2FF" : "transparent",
              color: isActive ? "#4F46E5" : "#374151",
              fontWeight: isActive ? 500 : 400, fontSize: 13,
            }}>
              <Icon name={v.icon} size={15} style={{ color: isActive ? "#4F46E5" : "#9CA3AF" }}/>
              <span style={{ flex: 1 }}>{v.label}</span>
              <span style={{ fontSize: 11, color: "#9CA3AF", fontWeight: 500 }}>{v.count}</span>
            </button>
          );
        })}
      </div>

      {/* MIDDLE — list */}
      <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column", borderRight: "1px solid #F0F1F4" }}>
        {/* page header */}
        <div style={{ padding: "20px 24px 14px", borderBottom: "1px solid #F0F1F4" }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 16, marginBottom: 12 }}>
            <div>
              <h1 style={{ margin: 0, fontSize: 22, fontWeight: 600, color: "#111827", letterSpacing: -0.015 }}>Service Desk</h1>
              <div style={{ fontSize: 12.5, color: "#6B7280", marginTop: 3 }}>
                {counts.offen} offene Einträge · <span style={{ color: counts.ueberfaellig > 0 ? "#991B1B" : "#6B7280", fontWeight: counts.ueberfaellig > 0 ? 500 : 400 }}>{counts.ueberfaellig} überfällig</span> · {counts.dieseWoche} diese Woche fällig
              </div>
            </div>
            <button style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "8px 13px", borderRadius: 10, background: "#4F46E5", color: "white", fontSize: 12.5, fontWeight: 500, flexShrink: 0 }}>
              <Icon name="plus" size={13}/> Neues Ticket
            </button>
          </div>
          {/* Filter chips bar */}
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", position: "relative" }}>
            <div style={{ position: "relative" }}>
              <button onClick={() => setFilterOpen(o => !o)} style={{
                display: "inline-flex", alignItems: "center", gap: 6, padding: "6px 11px",
                borderRadius: 999, border: "1px solid #E5E7EB", background: filterOpen ? "#F3F4F6" : "white",
                fontSize: 12, color: "#374151", fontWeight: 500
              }}>
                <Icon name="sliders" size={12}/> Filter
                {(urlState.quelle || urlState.typ) && <span style={{ width: 5, height: 5, borderRadius: 999, background: "#4F46E5" }}/>}
              </button>
              {filterOpen && <FilterPopover state={urlState} setState={setUrlState} onClose={() => setFilterOpen(false)} />}
            </div>

            {urlState.quelle && (
              <button onClick={() => setUrlState(s => ({ ...s, quelle: "" }))} style={{
                display: "inline-flex", alignItems: "center", gap: 5, padding: "5px 10px",
                borderRadius: 999, background: "#EEF2FF", color: "#4F46E5", fontSize: 11.5, fontWeight: 500
              }}>
                Quelle: {urlState.quelle === "workflow" ? "Workflow" : "Tickets"} <Icon name="x" size={11}/>
              </button>
            )}
            {urlState.typ && (
              <button onClick={() => setUrlState(s => ({ ...s, typ: "" }))} style={{
                display: "inline-flex", alignItems: "center", gap: 5, padding: "5px 10px",
                borderRadius: 999, background: "#EEF2FF", color: "#4F46E5", fontSize: 11.5, fontWeight: 500
              }}>
                Typ: {typLabelFor(urlState.typ)} <Icon name="x" size={11}/>
              </button>
            )}
            {(urlState.quelle || urlState.typ) && (
              <button onClick={() => setUrlState(s => ({ ...s, quelle: "", typ: "" }))} style={{ fontSize: 11.5, color: "#6B7280", padding: "5px 6px", fontWeight: 500 }}>
                Alle zurücksetzen
              </button>
            )}
          </div>
        </div>

        {/* grouped list */}
        <div style={{ flex: 1, overflowY: "auto" }}>
          {filtered.length === 0 && (
            <div style={{ padding: 56, textAlign: "center", color: "#9CA3AF", fontSize: 13 }}>
              Keine Einträge mit diesen Filtern.
            </div>
          )}
          {BUCKETS.map(bucket => {
            const items = grouped[bucket.key];
            if (!items || items.length === 0) return null;
            return (
              <div key={bucket.key}>
                <div style={{ padding: "10px 24px", background: "#FAFBFC", borderTop: "1px solid #F0F1F4", borderBottom: "1px solid #F0F1F4", display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ fontSize: 11, fontWeight: 600, color: bucket.color, textTransform: "uppercase", letterSpacing: 0.08 }}>{bucket.label}</span>
                  <span style={{ fontSize: 11, color: "#9CA3AF", fontWeight: 500 }}>{items.length}</span>
                </div>
                {items.map(e => {
                  const isSelected = urlState.selected === e.id;
                  const b = faelligBucket(e.faellig);
                  const d = e.faellig ? daysFromToday(e.faellig) : null;
                  const dateLabel = b === "ueberfaellig"
                    ? `${Math.abs(d)} ${Math.abs(d) === 1 ? "Tag" : "Tage"} überfällig`
                    : b === "heute" ? "heute" : b === "morgen" ? "morgen" : e.faellig ? formatShort(e.faellig) : "—";
                  return (
                    <button
                      key={e.id}
                      onClick={() => setUrlState(s => ({ ...s, selected: e.id }))}
                      className={isSelected ? "" : "row-hover"}
                      style={{
                        width: "100%", display: "grid", gridTemplateColumns: "4px 1fr auto",
                        gap: 12, alignItems: "center", padding: "11px 24px 11px 20px",
                        background: isSelected ? "#EEF2FF" : "transparent",
                        borderBottom: "1px solid #F7F8FA",
                        textAlign: "left", transition: "background 0.1s",
                      }}
                    >
                      <div style={{ width: 4, height: 36, borderRadius: 2, background: prioCfg[e.prioritaet].color, opacity: e.prioritaet === "niedrig" ? 0.3 : 0.9 }}/>
                      <div style={{ minWidth: 0 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 3 }}>
                          <TypeTag entry={e}/>
                          <span style={{ fontSize: 13, fontWeight: 500, color: isSelected ? "#4F46E5" : "#111827", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                            {entryTitle(e)}
                          </span>
                        </div>
                        <div style={{ fontSize: 11.5, color: "#6B7280", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                          {e.kontext}
                        </div>
                      </div>
                      <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 }}>
                        <div style={{ fontSize: 11.5, fontWeight: 500, color: b === "ueberfaellig" ? "#DC2626" : b === "heute" || b === "morgen" ? "#D97706" : "#6B7280", whiteSpace: "nowrap" }}>
                          {dateLabel}
                        </div>
                        <Avatar p={e.verantwortlich} size={18}/>
                      </div>
                    </button>
                  );
                })}
              </div>
            );
          })}
        </div>
      </div>

      {/* RIGHT — detail */}
      <div style={{ width: 400, flexShrink: 0, overflowY: "auto", background: "#FAFBFC" }}>
        {selected ? <DetailPane entry={selected} /> : (
          <div style={{ padding: 40, textAlign: "center", color: "#9CA3AF", fontSize: 13 }}>
            <Icon name="inbox" size={32} style={{ color: "#D1D5DB", marginBottom: 12 }}/>
            <div>Wähle einen Eintrag, um Details zu sehen.</div>
          </div>
        )}
      </div>
    </div>
  );
}

function formatShort(iso) {
  if (!iso) return "—";
  const [, m, d] = iso.split("-");
  const months = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  return `${parseInt(d)}. ${months[parseInt(m)-1]}`;
}
function daysFromToday(iso) {
  if (!iso) return null;
  const t = new Date(window.APP_DATA.TODAY);
  const d = new Date(iso);
  return Math.round((d - t) / 86400000);
}

window.ServiceDeskPage = ServiceDeskPage;
})();
</script>

<script type="text/babel" data-presets="react">
/* ==========================================================
   Detail Pane
   ========================================================== */
(function(){
const { Avatar, StatusPill, TypeTag, PriorityDot, FaelligDate } = window.shared;
const { statusCfg, prioCfg, formatDate, faelligBucket, entryTitle } = window.helpers;
const Icon = window.Icon;

function daysFromToday2(iso) {
  if (!iso) return null;
  const t = new Date(window.APP_DATA.TODAY);
  const d = new Date(iso);
  return Math.round((d - t) / 86400000);
}

function DetailPane({ entry }) {
  const [status, setStatus] = React.useState(entry.status);
  const [comment, setComment] = React.useState("");
  const [comments, setComments] = React.useState([]);
  React.useEffect(() => { setStatus(entry.status); setComments([]); setComment(""); }, [entry.id]);

  const b = faelligBucket(entry.faellig);
  const d = daysFromToday2(entry.faellig);
  const dueLabel = b === "ueberfaellig" ? `${Math.abs(d)} ${Math.abs(d) === 1 ? "Tag" : "Tage"} überfällig`
                 : b === "heute" ? "heute fällig"
                 : b === "morgen" ? "morgen fällig"
                 : entry.faellig ? formatDate(entry.faellig) : "—";

  const addComment = () => {
    if (!comment.trim()) return;
    setComments(cs => [...cs, { text: comment, at: "jetzt", by: "Maria Keller" }]);
    setComment("");
  };

  return (
    <div style={{ padding: "20px 22px 28px", display: "flex", flexDirection: "column", gap: 18 }}>
      {/* header */}
      <div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
          <TypeTag entry={entry}/>
          <span style={{ fontSize: 10.5, color: "#9CA3AF", fontFamily: "'JetBrains Mono', monospace" }}>{entry.id}</span>
          <div style={{ flex: 1 }}/>
          <button style={{ padding: 4, color: "#9CA3AF" }}><Icon name="more" size={16}/></button>
        </div>
        <h2 style={{ margin: 0, fontSize: 18, fontWeight: 600, color: "#111827", letterSpacing: -0.01, lineHeight: 1.3 }}>
          {entryTitle(entry)}
        </h2>
        <p style={{ margin: "6px 0 0", fontSize: 13, color: "#6B7280", lineHeight: 1.5 }}>{entry.kontext}</p>
      </div>

      {/* alert for urgent */}
      {(b === "ueberfaellig" || b === "heute") && (
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 12px", background: b === "ueberfaellig" ? "#FEF2F2" : "#FFFBEB", borderRadius: 10 }}>
          <Icon name="alert" size={14} style={{ color: b === "ueberfaellig" ? "#DC2626" : "#D97706" }}/>
          <span style={{ fontSize: 12, color: b === "ueberfaellig" ? "#991B1B" : "#92400E", fontWeight: 500 }}>{dueLabel}</span>
        </div>
      )}

      {/* meta grid */}
      <div style={{ background: "white", border: "1px solid #F0F1F4", borderRadius: 10, padding: 14 }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", rowGap: 14, columnGap: 16 }}>
          <Meta label="Typ" value={<TypeTag entry={entry}/>}/>
          <Meta label="Status" value={<StatusPill status={status}/>}/>
          {entry.person && <Meta label="Betroffene Person" value={
            <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
              <Avatar p={entry.person} size={18}/>
              <span style={{ fontSize: 12.5, fontWeight: 500 }}>{entry.person.name}</span>
            </span>
          }/>}
          <Meta label="Verantwortlich" value={
            <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
              <Avatar p={entry.verantwortlich} size={18}/>
              <span style={{ fontSize: 12.5, fontWeight: 500 }}>{entry.verantwortlich.name}</span>
            </span>
          }/>
          <Meta label="Priorität" value={
            <span style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12.5, fontWeight: 500, color: prioCfg[entry.prioritaet].color }}>
              <PriorityDot prio={entry.prioritaet}/>{prioCfg[entry.prioritaet].label}
            </span>
          }/>
          <Meta label="Fällig" value={<FaelligDate iso={entry.faellig}/>}/>
          <Meta label="Erstellt" value={<span style={{ fontSize: 12, color: "#6B7280" }}>{formatDate(entry.erstellt)}</span>}/>
        </div>
      </div>

      {/* Verlauf */}
      <div>
        <div style={{ fontSize: 11, color: "#9CA3AF", textTransform: "uppercase", letterSpacing: 0.08, fontWeight: 500, marginBottom: 10 }}>Verlauf</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <VerlaufEvent dot="#9CA3AF" actor={entry.verantwortlich.name} text="Eintrag erstellt" date={formatDate(entry.erstellt)}/>
          {entry.status === "in_bearbeitung" && (
            <VerlaufEvent dot="#D97706" actor={entry.verantwortlich.name} text="Status auf ‚In Bearbeitung' gesetzt" date={formatDate(entry.erstellt)}/>
          )}
          {comments.map((c, i) => (
            <VerlaufEvent key={i} dot="#4F46E5" actor={c.by} text={`kommentiert: "${c.text}"`} date={c.at}/>
          ))}
        </div>
      </div>

      {/* Aktionen */}
      <div style={{ background: "white", border: "1px solid #F0F1F4", borderRadius: 10, padding: 14, display: "flex", flexDirection: "column", gap: 12 }}>
        <div style={{ fontSize: 11, color: "#9CA3AF", textTransform: "uppercase", letterSpacing: 0.08, fontWeight: 500 }}>Aktionen</div>

        {/* Status-Dropdown */}
        <div>
          <label style={{ fontSize: 11, color: "#6B7280", fontWeight: 500, display: "block", marginBottom: 5 }}>Status ändern</label>
          <select value={status} onChange={(e) => setStatus(e.target.value)} style={{
            width: "100%", padding: "7px 10px", borderRadius: 8, border: "1px solid #E5E7EB",
            fontSize: 12.5, color: "#374151", background: "white", outline: "none"
          }}>
            <option value="offen">Offen</option>
            <option value="in_bearbeitung">In Bearbeitung</option>
            <option value="erledigt">Erledigt</option>
          </select>
        </div>

        {/* Kommentar */}
        <div>
          <label style={{ fontSize: 11, color: "#6B7280", fontWeight: 500, display: "block", marginBottom: 5 }}>Kommentar hinzufügen</label>
          <textarea value={comment} onChange={(e) => setComment(e.target.value)} placeholder="Kurzer Kommentar zum Stand…" style={{
            width: "100%", padding: "8px 10px", borderRadius: 8, border: "1px solid #E5E7EB",
            fontSize: 12.5, color: "#374151", minHeight: 60, resize: "vertical", outline: "none", lineHeight: 1.4
          }}/>
          <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 6 }}>
            <button onClick={addComment} disabled={!comment.trim()} style={{
              padding: "5px 11px", borderRadius: 8, fontSize: 12, fontWeight: 500,
              background: comment.trim() ? "#F3F4F6" : "#F3F4F6",
              color: comment.trim() ? "#374151" : "#9CA3AF",
              cursor: comment.trim() ? "pointer" : "not-allowed",
            }}>Speichern</button>
          </div>
        </div>

        {/* Dokumente */}
        {(entry.quelle === "workflow" || entry.typ === "SCHLUESSEL" || entry.typ === "MELDUNG") && (
          <div>
            <label style={{ fontSize: 11, color: "#6B7280", fontWeight: 500, display: "block", marginBottom: 5 }}>Dokumente</label>
            <button style={{
              width: "100%", padding: "9px 10px", borderRadius: 8, border: "1px dashed #D1D5DB",
              display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6,
              fontSize: 12, color: "#6B7280", fontWeight: 500, background: "#FAFBFC"
            }}>
              <Icon name="upload" size={13}/> Datei hochladen
            </button>
          </div>
        )}
      </div>

      {/* Primary CTA: Erledigt */}
      <div style={{ display: "flex", justifyContent: "flex-end" }}>
        <button onClick={() => setStatus("erledigt")} style={{
          padding: "9px 14px", borderRadius: 10,
          background: status === "erledigt" ? "#ECFDF5" : "#4F46E5",
          color: status === "erledigt" ? "#065F46" : "white",
          fontSize: 12.5, fontWeight: 500, display: "inline-flex", alignItems: "center", gap: 6,
          border: status === "erledigt" ? "1px solid #A7F3D0" : "none",
        }}>
          <Icon name="check" size={13}/> {status === "erledigt" ? "Erledigt" : "Als erledigt markieren"}
        </button>
      </div>
    </div>
  );
}

function Meta({ label, value }) {
  return (
    <div>
      <div style={{ fontSize: 10, color: "#9CA3AF", textTransform: "uppercase", letterSpacing: 0.08, fontWeight: 500, marginBottom: 4 }}>{label}</div>
      <div>{value}</div>
    </div>
  );
}

function VerlaufEvent({ dot, actor, text, date }) {
  return (
    <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
      <div style={{ width: 6, height: 6, borderRadius: 999, background: dot, marginTop: 6, flexShrink: 0 }}/>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 12, color: "#374151" }}>
          <span style={{ fontWeight: 500 }}>{actor}</span> · {text}
        </div>
        <div style={{ fontSize: 11, color: "#9CA3AF", marginTop: 1 }}>{date}</div>
      </div>
    </div>
  );
}

window.DetailPane = DetailPane;
})();
</script>

<script type="text/babel" data-presets="react">
/* ==========================================================
   App shell
   ========================================================== */
const { Sidebar, Topbar } = window.chrome;
const { ServiceDeskPage } = window;

function App() {
  const [urlState, setUrlState] = window.useUrlState();
  return (
    <div data-screen-label="Service Desk" style={{ minHeight: "100vh", background: "#F7F8FA" }}>
      <Sidebar />
      <div style={{ marginLeft: 256 }}>
        <Topbar />
        <ServiceDeskPage urlState={urlState} setUrlState={setUrlState} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
